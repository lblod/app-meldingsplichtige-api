<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Advies bij jaarrekening - Test {{RUN_ID}}</title>
</head>
<body>
<div vocab="http://data.vlaanderen.be/ns/besluit#"
     prefix="eli: http://data.europa.eu/eli/ontology# prov: http://www.w3.org/ns/prov# mandaat: http://data.vlaanderen.be/ns/mandaat# besluit: http://data.vlaanderen.be/ns/besluit# skos: http://www.w3.org/2004/02/skos/core# foaf: http://xmlns.com/foaf/0.1/ dct: http://purl.org/dc/terms/ xsd: http://www.w3.org/2001/XMLSchema# ext: http://mu.semte.ch/vocabularies/ext/ elod: http://linkedeconomy.org/ontology#">

  <!-- Gemeente approval: a zitting containing the besluit of type
       "Advies bij jaarrekening eredienstbestuur" with eli:is_about pointing at
       the eredienstbestuur, and an artikel of type "Gunstig advies" referring
       (eli:refers_to) to the eredienstbestuur's SubmissionDocument. -->
  <div typeof="besluit:Zitting" resource="http://test.local/zittingen/{{RUN_ID}}-advies">
      <span property="besluit:isGehoudenDoor" typeof="besluit:Bestuursorgaan" resource="{{ORGAN_IN_TIJD}}">
        <span property="mandaat:isTijdspecialisatieVan" typeof="besluit:Bestuursorgaan" resource="{{ORGAN_ABSTRACT}}">
          <span property="skos:prefLabel">{{ORGAN_LABEL}}</span>
        </span>
      </span>
      <span property="besluit:geplandeStart" datatype="xsd:dateTime" content="{{ZITTING_GEPLANDE_START}}"></span>
      <span property="prov:startedAtTime" datatype="xsd:dateTime" content="{{ZITTING_START}}"></span>
      <span property="prov:endedAtTime" datatype="xsd:dateTime" content="{{ZITTING_END}}"></span>

      <div property="besluit:behandelt" typeof="besluit:Agendapunt" resource="http://test.local/agendapunten/{{RUN_ID}}-advies-1">
        <span property="dct:title" datatype="xsd:string">Advies bij de jaarrekening van {{KFB_NAME}}</span>
        <span property="besluit:geplandOpenbaar" datatype="xsd:boolean" content="true"></span>
      </div>

      <div typeof="besluit:BehandelingVanAgendapunt" resource="http://test.local/behandelingen-van-agendapunten/{{RUN_ID}}-advies-1">
        <span property="dct:subject" resource="http://test.local/agendapunten/{{RUN_ID}}-advies-1"></span>
        <span property="besluit:openbaar" datatype="xsd:boolean" content="true"></span>
        <div property="prov:generated" typeof="besluit:Besluit {{ADVIES_BESLUIT_TYPE}}" resource="{{BESLUIT_URI}}">
          <span property="dct:type" resource="{{ADVIES_BESLUIT_TYPE}}"></span>
          <span property="eli:passed_by" resource="{{ORGAN_IN_TIJD}}"></span>
          <span property="eli:date_publication" datatype="xsd:date" content="{{DATE_PUBLICATION}}"></span>
          <span property="elod:financialYear" datatype="xsd:gYear" content="{{RAPPORTJAAR}}">{{RAPPORTJAAR}}</span>
          <span property="eli:title" datatype="xsd:string">Gunstig advies bij de jaarrekening van {{KFB_NAME}} - {{RUN_ID}}</span>
          <span property="eli:is_about" typeof="besluit:Bestuurseenheid" resource="{{KFB_ORG}}">{{KFB_NAME}}</span>
          <div property="besluit:motivering">
            <div property="prov:value" datatype="xsd:string">
              <div property="eli:has_part" resource="http://test.local/artikels/{{RUN_ID}}-advies-artikel-1" typeof="besluit:Artikel">
                <div property="eli:number" datatype="xsd:string">Artikel 1</div>
                <div property="eli:type_document" resource="{{ARTIKELTYPE}}"></div>
                <div property="eli:refers_to" resource="{{ERDIENST_DOCUMENT}}"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
  </div>

</div>
</body>
</html>
