<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Bundel jaarrekeningen - Test {{RUN_ID}}</title>
</head>
<body>
<div vocab="http://data.vlaanderen.be/ns/besluit#"
     prefix="eli: http://data.europa.eu/eli/ontology# prov: http://www.w3.org/ns/prov# mandaat: http://data.vlaanderen.be/ns/mandaat# besluit: http://data.vlaanderen.be/ns/besluit# skos: http://www.w3.org/2004/02/skos/core# foaf: http://xmlns.com/foaf/0.1/ dct: http://purl.org/dc/terms/ xsd: http://www.w3.org/2001/XMLSchema# elod: http://linkedeconomy.org/ontology#">

  <!-- Zitting of the centraal kerkbestuur. -->
  <div typeof="besluit:Zitting" resource="http://test.local/zittingen/{{RUN_ID}}-bundel">
    <span property="besluit:isGehoudenDoor" typeof="besluit:Bestuursorgaan" resource="{{ORGAN_IN_TIJD}}">
      <span property="mandaat:isTijdspecialisatieVan" typeof="besluit:Bestuursorgaan" resource="{{ORGAN_ABSTRACT}}">
        <span property="skos:prefLabel">{{ORGAN_LABEL}}</span>
      </span>
    </span>
    <span property="besluit:geplandeStart" datatype="xsd:dateTime" content="{{ZITTING_GEPLANDE_START}}"></span>
    <span property="prov:startedAtTime" datatype="xsd:dateTime" content="{{ZITTING_START}}"></span>
    <span property="prov:endedAtTime" datatype="xsd:dateTime" content="{{ZITTING_END}}"></span>

    <div property="besluit:behandelt" typeof="besluit:Agendapunt" resource="http://test.local/agendapunten/{{RUN_ID}}-bundel-1">
      <span property="dct:title" datatype="xsd:string">Bundel jaarrekeningen {{RAPPORTJAAR}} - {{RUN_ID}}</span>
      <span property="besluit:geplandOpenbaar" datatype="xsd:boolean" content="true"></span>
    </div>
  </div>

  <!-- Behandeling van agendapunt generating the bundle document. The
       submitted resource (sent in "submittedResource" of the melding) is the
       object of prov:generated here. -->
  <div typeof="besluit:BehandelingVanAgendapunt" resource="http://test.local/behandelingen-van-agendapunten/{{RUN_ID}}-bundel-1">
    <span property="dct:subject" resource="http://test.local/agendapunten/{{RUN_ID}}-bundel-1"></span>
    <span property="besluit:openbaar" datatype="xsd:boolean" content="true"></span>

    <!-- CKB bundle document: type "Gezamenlijk indienen van de jaarrekeningen
         van de besturen van de eredienst" with a dct:relation to the
         eredienstbestuur's SubmissionDocument. The form requires rapportjaar
         (elod:financialYear) and gerelateerde documenten (dct:relation). -->
    <div property="prov:generated" typeof="foaf:Document {{CKB_BUNDLE_TYPE}}" resource="{{DOC_URI}}">
      <span property="dct:type" resource="{{CKB_BUNDLE_TYPE}}"></span>
      <span property="eli:passed_by" resource="{{ORGAN_IN_TIJD}}"></span>
      <span property="eli:date_publication" datatype="xsd:date" content="{{DATE_PUBLICATION}}"></span>
      <span property="eli:title" datatype="xsd:string">Het centraal kerkbestuur bundelt de jaarrekeningen {{RAPPORTJAAR}} - {{RUN_ID}}</span>
      <span property="eli:description" datatype="xsd:string">Het centraal kerkbestuur bundelt de jaarrekeningen van rapportjaar {{RAPPORTJAAR}}. {{RUN_ID}}</span>
      <span property="elod:financialYear" datatype="xsd:gYear" content="{{RAPPORTJAAR}}">{{RAPPORTJAAR}}</span>
      <span property="dct:relation" resource="{{ERDIENST_DOCUMENT}}"></span>
    </div>
  </div>

</div>
</body>
</html>
