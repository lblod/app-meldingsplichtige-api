<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Jaarrekening - Test {{RUN_ID}}</title>
</head>
<body>
<div vocab="http://data.vlaanderen.be/ns/besluit#"
     prefix="eli: http://data.europa.eu/eli/ontology# prov: http://www.w3.org/ns/prov# mandaat: http://data.vlaanderen.be/ns/mandaat# besluit: http://data.vlaanderen.be/ns/besluit# skos: http://www.w3.org/2004/02/skos/core# foaf: http://xmlns.com/foaf/0.1/ dct: http://purl.org/dc/terms/ xsd: http://www.w3.org/2001/XMLSchema# elod: http://linkedeconomy.org/ontology#">

  <!-- Zitting: the jaarrekening is decided on a zitting of the kerkraad. -->
  <div typeof="besluit:Zitting" resource="http://test.local/zittingen/{{RUN_ID}}">
    <span property="besluit:isGehoudenDoor" typeof="besluit:Bestuursorgaan" resource="{{ORGAN_IN_TIJD}}">
      <span property="mandaat:isTijdspecialisatieVan" typeof="besluit:Bestuursorgaan" resource="{{ORGAN_ABSTRACT}}">
        <span property="skos:prefLabel">{{ORGAN_LABEL}}</span>
      </span>
    </span>
    <span property="besluit:geplandeStart" datatype="xsd:dateTime" content="{{ZITTING_GEPLANDE_START}}"></span>
    <span property="prov:startedAtTime" datatype="xsd:dateTime" content="{{ZITTING_START}}"></span>
    <span property="prov:endedAtTime" datatype="xsd:dateTime" content="{{ZITTING_END}}"></span>

    <div property="besluit:behandelt" typeof="besluit:Agendapunt" resource="http://test.local/agendapunten/{{RUN_ID}}-1">
      <span property="dct:title" datatype="xsd:string">Jaarrekening rapportjaar {{RAPPORTJAAR}} - {{RUN_ID}}</span>
      <span property="besluit:geplandOpenbaar" datatype="xsd:boolean" content="true"></span>
    </div>
  </div>

  <!-- Behandeling van agendapunt generating the besluit. The submitted
       resource (the URI sent in "submittedResource" of the melding) is the
       object of prov:generated here: the "Datum zitting/besluit" form field
       resolves via inverse(prov:generated) dct:subject inverse(besluit:behandelt)
       prov:startedAtTime. -->
  <div typeof="besluit:BehandelingVanAgendapunt" resource="http://test.local/behandelingen-van-agendapunten/{{RUN_ID}}-1">
    <span property="dct:subject" resource="http://test.local/agendapunten/{{RUN_ID}}-1"></span>
    <span property="besluit:openbaar" datatype="xsd:boolean" content="true"></span>

    <!-- Submitted resource: the jaarrekening besluit of the eredienstbestuur. -->
    <div property="prov:generated" typeof="foaf:Document besluit:Besluit {{JAARREKENING_TYPE}}" resource="{{DOC_URI}}">
      <span property="dct:type" resource="{{JAARREKENING_TYPE}}"></span>
      <span property="eli:passed_by" resource="{{ORGAN_IN_TIJD}}"></span>
      <span property="eli:date_publication" datatype="xsd:date" content="{{DATE_PUBLICATION}}"></span>
      <span property="eli:title" datatype="xsd:string">De kerkraad stelt de jaarrekening {{RAPPORTJAAR}} vast - {{RUN_ID}}</span>
      <span property="eli:description" datatype="xsd:string">De kerkraad keurt de jaarrekening van rapportjaar {{RAPPORTJAAR}} goed. {{RUN_ID}}</span>
      <span property="elod:financialYear" datatype="xsd:gYear" content="{{RAPPORTJAAR}}">{{RAPPORTJAAR}}</span>
    </div>
  </div>

</div>
</body>
</html>
